name: term-deposit-manager

services:
  deposit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: term-deposit-manager
    ports:
      - "127.0.0.1:3457:3457"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3457
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3457/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
