<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/x-icon" href="./assets/icon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="./assets/icon.png" />
    <title>サーバー停止中 - 定期預金マネージャー</title>
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #0f766e;
        --primary-hover: #0d9488;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo',
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px 24px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f1f5f9;
        color: #475569;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.4;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.65;
        color: var(--text-muted);
      }
      code {
        padding: 2px 6px;
        border-radius: 4px;
        background: #f1f5f9;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--primary-hover);
      }
      .status {
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">サーバー停止中</div>
      <h1>ローカルサーバーが起動していません</h1>
      <p>
        コンテナが停止しているため、アプリに接続できません。<br />
        <code>start.bat</code>（macOS の場合は <code>start.command</code>）を実行してサーバーを起動してください。
      </p>
      <div class="actions">
        <button id="retry-btn" type="button">今すぐ再接続</button>
        <div id="status-text" class="status">サーバーの起動を待機しています…（起動後に自動で開きます）</div>
      </div>
    </main>
    <script>
      const statusText = document.getElementById('status-text');
      const retryBtn = document.getElementById('retry-btn');
      let checking = false;

      async function checkHealth(manual) {
        if (checking) return;
        checking = true;
        if (manual && statusText) {
          statusText.textContent = '接続を確認しています…';
        }
        try {
          const res = await fetch('/api/health', { cache: 'no-store' });
          if (res.ok) {
            window.location.replace('/');
            return;
          }
        } catch {
          // サーバー停止中は接続エラーになるため待機を継続
        } finally {
          checking = false;
          if (manual && statusText) {
            statusText.textContent =
              'まだ接続できません。start.bat の実行後に自動で開きます…';
          }
        }
      }

      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          void checkHealth(true);
        });
      }

      setInterval(() => {
        void checkHealth(false);
      }, 2000);
    </script>
  </body>
</html>
